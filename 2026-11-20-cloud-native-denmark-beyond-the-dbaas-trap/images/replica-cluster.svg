<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="head-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#05825f"/>
    </marker>
  </defs>

  <!-- Production status banner, closing the sequence started in phase 1 -->
  <rect x="320" y="4" width="260" height="36" rx="18" fill="#05825f"/>
  <text x="450" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">Production running</text>

  <g transform="translate(0 46)">
  <!-- Cluster A -->
  <rect x="10" y="10" width="330" height="320" rx="8" fill="#ffffff" stroke="#136a7f" stroke-width="2.5"/>
  <text x="26" y="42" font-size="19" font-weight="bold" fill="#136a7f">Cloud A<tspan font-size="16" font-weight="normal"> (public or on-premises)</tspan></text>

  <rect x="28" y="62" width="294" height="184" rx="10" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="48" y="234" width="210" height="24" rx="12" fill="#e7c568" stroke="#c9a227" stroke-width="2"/>
  <text x="153" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#28495a">CloudNativePG Cluster</text>

  <path d="M44 80 v40 a46 12 0 0 0 92 0 v-40" fill="#f6e7b8" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="90" cy="80" rx="46" ry="12" fill="#faefcf" stroke="#136a7f" stroke-width="2.5"/>
  <text x="90" y="118" text-anchor="middle" font-size="16" fill="#136a7f">Replica</text>
  <path d="M44 180 v40 a46 12 0 0 0 92 0 v-40" fill="#f6e7b8" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="90" cy="180" rx="46" ry="12" fill="#faefcf" stroke="#136a7f" stroke-width="2.5"/>
  <text x="90" y="218" text-anchor="middle" font-size="16" fill="#136a7f">Replica</text>

  <path d="M198 120 v62 a52 14 0 0 0 104 0 v-62" fill="#e7c568" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="250" cy="120" rx="52" ry="14" fill="#f0d68a" stroke="#136a7f" stroke-width="2.5"/>
  <text x="250" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#136a7f">Primary</text>

  <g fill="none" stroke="#05825f" stroke-width="3.5">
    <path d="M194 151 H168 V100 H142" marker-end="url(#head-green)"/>
    <path d="M168 151 V200 H142" marker-end="url(#head-green)"/>
  </g>

  <rect x="85" y="270" width="170" height="42" rx="6" fill="#eef4f6" stroke="#136a7f" stroke-width="1.8"/>
  <text x="170" y="297" text-anchor="middle" font-size="17" fill="#136a7f">Object storage</text>

  <!-- Cluster B (replica cluster) -->
  <rect x="560" y="10" width="330" height="320" rx="8" fill="#ffffff" stroke="#136a7f" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="576" y="42" font-size="19" font-weight="bold" fill="#136a7f">Cloud B<tspan font-size="16" font-weight="normal"> (public or on-premises)</tspan></text>

  <rect x="578" y="62" width="294" height="184" rx="10" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="596" y="234" width="250" height="24" rx="12" fill="#e7c568" stroke="#c9a227" stroke-width="2"/>
  <text x="721" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#28495a">CloudNativePG replica cluster</text>

  <path d="M598 120 v62 a52 14 0 0 0 104 0 v-62" fill="#e7c568" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="650" cy="120" rx="52" ry="14" fill="#f0d68a" stroke="#136a7f" stroke-width="2.5"/>
  <text x="650" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#136a7f">Designated</text>
  <text x="650" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#136a7f">primary</text>

  <path d="M764 80 v40 a46 12 0 0 0 92 0 v-40" fill="#f6e7b8" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="810" cy="80" rx="46" ry="12" fill="#faefcf" stroke="#136a7f" stroke-width="2.5"/>
  <text x="810" y="118" text-anchor="middle" font-size="16" fill="#136a7f">Replica</text>
  <path d="M764 180 v40 a46 12 0 0 0 92 0 v-40" fill="#f6e7b8" stroke="#136a7f" stroke-width="2.5"/>
  <ellipse cx="810" cy="180" rx="46" ry="12" fill="#faefcf" stroke="#136a7f" stroke-width="2.5"/>
  <text x="810" y="218" text-anchor="middle" font-size="16" fill="#136a7f">Replica</text>

  <g fill="none" stroke="#05825f" stroke-width="3.5">
    <path d="M706 151 H732 V100 H758" marker-end="url(#head-green)"/>
    <path d="M732 151 V200 H758" marker-end="url(#head-green)"/>
  </g>

  <rect x="645" y="270" width="170" height="42" rx="6" fill="#eef4f6" stroke="#136a7f" stroke-width="1.8"/>
  <text x="730" y="297" text-anchor="middle" font-size="17" fill="#136a7f">Object storage</text>

  <!-- Physical replication between the two sites -->
  <line x1="308" y1="151" x2="594" y2="151" stroke="#05825f" stroke-width="6" marker-end="url(#head-green)"/>
  <text x="450" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#05825f">physical replication</text>
  <text x="450" y="138" text-anchor="middle" font-size="14" fill="#05825f">continuous</text>
  <text x="450" y="188" text-anchor="middle" font-size="15" font-style="italic" fill="#136a7f">promote to switch over</text>
  </g>
</svg>
