 * EDB: Marp theme
 * =================================================================
 * Reimplementation of EDB's official Google Slides / PowerPoint decks:
 * `CNPG TEMPLATE.pptx` (the `title` layout) and `EDB TEMPLATE.pptx` (the
 * default content layout), plus three of Gabriele's own recurring
 * talk slides (`Icebraker.pptx`, `about me.pptx`, `section.pptx`)
 * for the `icebreaker`, `about` and `section-break` classes below.
 * The personal decks are Google Slides exports on a 9144000x5143500 EMU
 * canvas (Google's 10in widescreen default) rather than the official
 * template's 12192000x6858000 EMU, so their offsets are converted at
 * 7143.75 EMU/px (== 9525 EMU/px * 3/4) instead of 9525; both land on
 * Marp's 1280x720 canvas at the same effective scale. Every value below
 * is taken from the relevant file's OOXML, not eyeballed; point sizes
 * convert at 1pt = 4/3 px regardless of which canvas they came from.
 *
 * Slide classes
 * -------------
 *   title     Opening slide. Blue gradient, EDB Postgres AI logo top left,
 *             white H1, gold H2, light-grey author block, copyright footer.
 *             Pagination is suppressed, matching the source layout.
 *
 *             # Talk title
 *             ## Subtitle
 *             **Name**
 *             Role
 *
 *   (default) Standard content slide: no class needed, this is what a
 *             slide gets if it isn't `title`. White background, one H1,
 *             an optional H2 subtitle line right under it, body copy with
 *             up to two bullet levels, colour EDB Postgres AI logo bottom
 *             left, copyright footer bottom right, and a deck footer
 *             (front matter's `footer:`, e.g. "G. Bartolini · Postgres
 *             Summit US"; defaults from `author_short`/`author` + `event`
 *             when not set explicitly, see tools/marp-qrcode-engine.cjs)
 *             bottom left. A slide with no
 *             subtitle gets a tighter heading-to-body gap automatically
 *             (via `section:has(> h2)`): no extra markup needed either
 *             way, just include the `##` line or don't.
 *
 *             # Slide heading
 *             ## Optional subtitle
 *
 *             - Level 1
 *               - Level 2
 *
 *   icebreaker  Provocative question, shown before the title slide. Same
 *               blue gradient and mono logo treatment as `title`; a single
 *               centred statement, **bold** for emphasis. Pagination is
 *               suppressed, matching the source layout.
 *
 *               A question **with emphasis** on some words.
 *
 *   about       Personal bio card: bold teal heading, circular photo with
 *               an accent ring, name + role lines beside it. The name is
 *               the bio block's first paragraph: it's bold automatically,
 *               no `**...**` needed. White background, same footer/logo as
 *               the default content layout.
 *
 *               # About me
 *
 *               ![](images/photo.jpg)
 *
 *               <div class="bio">
 *
 *               Name
 *
 *               Role line
 *
 *               </div>
 *
 *   section-break  Divider between talk sections: bold teal H1 on the left
 *                  half, full-bleed photo on the right via Marp's own
 *                  `![bg right:50%]` (this class only styles the text
 *                  side). Top-left logo is the larger full-colour mark,
 *                  not the small one the default content layout uses. An
 *                  optional H2 subtitle sits right under the title.
 *
 *                  # Section title
 *                  ## Optional subtitle
 *
 *                  ![bg right:50%](images/photo.jpg)
 *
 * Content components
 * -------------------
 * Unlike the slide classes above, these aren't applied with `_class`;
 * they're plain CSS classes for a `<div>` you drop inside a normal
 * (default-layout) slide, below its heading. Not sourced from any EDB
 * template; original components for content shapes the template's
 * catalogue doesn't cover.
 *
 *   timeline  A horizontal sequence of dated milestones on one line,
 *             labels alternating above/below so neighbours don't
 *             collide. Works for any number of `.milestone`s: the line
 *             divides evenly between however many are in the block. A
 *             label's first paragraph is its title: it's bold
 *             automatically, no `**...**` needed (same convention as
 *             `about`'s bio block).
 *
 *             # A section heading
 *
 *             <div class="timeline">
 *
 *             <div class="milestone">
 *             <div class="label">
 *
 *             Milestone title
 *
 *             One line of detail.
 *
 *             </div>
 *             <div class="dot"></div>
 *             <div class="date">Year</div>
 *             </div>
 *
 *             \3c !-- one .milestone per point, in order -->
 *
 *             </div>
 *
 *   img-center  A single image, centred, at a given width: the shape
 *               almost every one-image slide in practice turns out to
 *               need. Plain markdown can't put a class on `![]()`
 *               directly, so this goes on a wrapping `<div>`; set the
 *               width with the `--img-w` custom property (defaults to
 *               480px if you don't), not a one-off `\3c style scoped>`
 *               block per slide.
 *
 *               <div class="img-center" style="--img-w: 300px;">
 *
 *               ![](images/diagram.png)
 *
 *               </div>
 *
 *               <div class="caption">Caption text</div>
 *
 *   logo-row    A horizontal row of logos, same height, centred, evenly
 *               spaced: for a "who backs this" or "built with" strip.
 *               Set `--logo-row-h` to change the shared height (default
 *               72px). Wraps to a second line rather than shrinking any
 *               logo out of proportion if it doesn't fit at that height
 *               (never silently distorts one to make it fit).
 *
 *               <div class="logo-row">
 *
 *               ![](images/logo-a.png)
 *
 *               ![](images/logo-b.png)
 *
 *               </div>
 *
 *   caption     Small italic grey caption text under an image or
 *               diagram: pairs with `img-center` (above) but works
 *               under any image.
 *
 *   compare     Two side-by-side labelled panels, for a "traditional vs
 *               CloudNativePG" style comparison. Sized to a shared
 *               *height* (`--compare-h`), not width, since the two
 *               images being compared rarely share an aspect ratio;
 *               matching width would leave a wide image short and a
 *               narrow one tall right next to each other. Each column's
 *               first paragraph becomes its label, styled automatically
 *               (same "first paragraph is the label" convention as
 *               `timeline`'s milestone label and `about`'s bio, not a
 *               new one).
 *
 *               <div class="compare">
 *
 *               <div class="compare-col">
 *
 *               Traditional environment
 *
 *               ![](images/before.png)
 *
 *               </div>
 *
 *               <div class="compare-col">
 *
 *               CloudNativePG
 *
 *               ![](images/after.png)
 *
 *               </div>
 *
 *               </div>
 *
 * Custom properties
 * -----------------
 *   --edb-year      Year in the copyright footer. Override per deck:
 *                   style: ":root { --edb-year: '2027'; }"
 *   --img-w         `img-center`'s width (default 480px). Set inline on
 *                   the element: style="--img-w: 300px;"
 *   --logo-row-h    `logo-row`'s shared logo height (default 72px). Same,
 *                   set inline: style="--logo-row-h: 60px;"
 *   --compare-h     `compare`'s shared panel height (default 360px).
 *                   Same, set inline: style="--compare-h: 320px;"
 *
 * `title` and the default content layout are done; 26 of the EDB
 * template's 28 layouts still fall back to the inherited Marp default
 * theme. `icebreaker`, `about` and `section-break` are separate,
 * outside that 28: Gabriele's own recurring slides, not part of the
 * official template's layout catalogue. `timeline` is separate again:
 * a content component, not a slide layout at all.

</ul>
</li>

<ul>
<li>I am one of the founders and maintainers</li>

<li>Some of the concepts also adapt to 1st generation operators</li>
</ul>
</li>
<li><strong>Don't just believe me: do your own research</strong>
<ul>
<li>Pick CloudNativePG and two other operators, and test them</li>
<li>Involve your infrastructure/Kubernetes team in the process</li>
<li>Choose what makes you confident running it in production</li>
</ul>
</li>

<h1 id="the-goal">The goal</h1>
<div class="goal">
<div class="col-text">
<ul>
<li>Move Postgres from a <strong>traditional environment</strong> like the one in this diagram, into a <strong>Kubernetes environment</strong>
<ul>
<li>yes, that includes <strong>bare metal</strong>, not just the cloud or VMs</li>
</ul>
</li>
<li>The same concepts apply to <strong>any</strong> Postgres migration, even from a cloud DBaaS such as RDS</li>
</ul>
<div class="caption">traditional environment = an operating system like Linux on a VM or bare metal</div>
</div>
<div class="col-image">
<p><img src="images/vm-world-ha.png" alt="" /></p>
</div>
</div>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>

<h1 id="running-postgres-on-kubernetes-in-a-nutshell">Running Postgres on Kubernetes in a nutshell</h1>
<h2 id="complex-topic-scan-the-qr-code-for-background-information">Complex topic, scan the QR code for background information</h2>
<ul>
<li><strong>You probably didn't choose Kubernetes</strong>
<ul>
<li>That's usually an organisational decision, and DBAs are rarely part of it</li>
</ul>
</li>
<li><strong>Your organisation needs to know both technologies, collectively</strong> (third parties included)
<ul>
<li>You, as an individual, don't need to know both, just build a <strong>T-shaped</strong> profile and collaborate
<ul>
<li>DBAs: the CNCF's <strong>Certified Kubernetes Administrator (CKA)</strong> helps you build the top of your T</li>
</ul>
</li>
</ul>
</li>
<li>Adopt cloud-native paradigms and avoid <strong>lift-and-shift</strong> operations</li>
<li>Use an <strong>Operator</strong> to run Postgres
<ul>
<li>Advice: don't attempt to run it as a plain <code>Deployment</code> or <code>StatefulSet</code></li>
</ul>
</li>
</ul>
<div class="t-shaped-corner">
<p><img src="images/t-shaped-profile-2.webp" alt="" /></p>
</div>

<h1 id="what-is-cloudnativepg">What is CloudNativePG?</h1>
<h2 id="the-most-popular-operator-for-postgres">The most popular operator for Postgres</h2>
<div class="cnpg-logo-corner">
<p><img src="images/cloudnativepg-landscape-blue.png" alt="" /></p>
</div>
<ul>
<li><strong>Second-generation operator</strong> for Postgres
<ul>
<li>Kubernetes-native, no external failover manager, pluggable backup system, no <code>StatefulSet</code></li>
<li>Entirely declarative, focused on the <code>Cluster</code> resource</li>
</ul>
</li>
<li>Created by EDB, now part of the <strong>Cloud Native Computing Foundation</strong> (CNCF)
<ul>
<li>Alongside Kubernetes, Prometheus, OpenTelemetry, Keycloak, and SPIFFE/SPIRE</li>
<li><strong>CNCF Sandbox project</strong> (1st stage), working toward CNCF Incubation (2nd stage of three)</li>
</ul>
</li>
<li>Vendor-neutral governance, with a growing contributor and user base outside EDB</li>
<li><strong>Health score: 84/100</strong>, &quot;Healthy&quot; (Linux Foundation Insights)
<ul>
<li><strong>Top 10% of open source projects</strong> for total commits in the last 12 months</li>
</ul>
</li>
</ul>

<h1 id="architecture">Architecture</h1>
<h2 id="how-the-database-architecture-changes-when-moving-to-cloudnativepg">How the database architecture changes when moving to CloudNativePG</h2>
<ol>
<li>Transition from a <strong>database-centric perspective</strong> to an <strong>infrastructure-wide</strong> one
<ul>
<li>Postgres must be seen as any other application, with some special needs as a data workload</li>
<li><strong>&quot;Cattle vs Pets&quot; → &quot;Cattle vs Elephant herds&quot; for Postgres</strong>: the herd concept, applied to your database
<ul>
<li>Kubernetes enables this with clear separation of responsibility between DBA and platform team</li>
</ul>
</li>
</ul>
</li>
<li>Define your <strong>architectural building block</strong> in a <strong>single Kubernetes cluster</strong>
<ul>
<li><strong>Physical layer</strong>: nodes, availability zones, where things actually run</li>
<li><strong>Logical layer</strong>: namespaces, services, the <code>Cluster</code> resource, what you actually declare</li>
</ul>
</li>
<li>Apply the building block <strong>across the different Kubernetes clusters</strong>
<ul>
<li>Symmetric architectures with the distributed topology feature of replica clusters</li>
<li>Enable hybrid and multi-cloud setups, across regions</li>
</ul>
</li>
</ol>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>

<h1 id="logical-layer-adding-continuous-backup">Logical layer: adding continuous backup</h1>
<h2 id="your-architectural-building-block-for-cloudnativepg-cluster-within-a-single-kubernetes-cluster">Your architectural building block for CloudNativePG <code>Cluster</code> within a single Kubernetes cluster</h2>
<ul>
<li>Native support:
<ul>
<li><strong>Standard Volume snapshots</strong>, inside the same namespace</li>
</ul>
</li>
<li>Via CNPG-I plugins:
<ul>
<li><strong>Object store</strong>, inside or outside Kubernetes (e.g. Barman Cloud plugin)</li>
<li><strong>Local persistent volume</strong>, inside the same Kubernetes cluster (e.g. Klio, <em>experimental</em>)</li>
</ul>
</li>
</ul>

<h1 id="storage-in-cloudnativepg">Storage in CloudNativePG</h1>
<ul>
<li>Redundancy comes from <strong>Postgres replication</strong>, not from the storage layer</li>
<li>Storage in CloudNativePG is provisioned via:
<ul>
<li>Standard <code>StorageClass</code> resource</li>
<li><strong>Container Storage Interface (CSI) drivers</strong></li>
</ul>
</li>
<li><strong>Network storage</strong> (most common in Kubernetes):
<ul>
<li><em>Attention:</em> Blocks are normally replicated 3 times (<em>write amplification</em> issue)</li>
<li>Examples: <strong><a href="https://rook.io/">Rook</a></strong> (Ceph), <strong><a href="https://longhorn.io/">Longhorn</a></strong>, cloud-provider CSI drivers, enterprise SAN</li>
</ul>
</li>
<li><strong>Local storage</strong> on the node (generally recommended for Postgres)
<ul>
<li>Enables <strong>shared-nothing architectures</strong></li>
<li>On <strong>bare metal Kubernetes worker nodes</strong>, use <strong>directly attached NVMe drives through LVM</strong></li>
<li>Examples: <strong><a href="https://openebs.io/">OpenEBS</a></strong> (Local PV), <strong><a href="https://github.com/topolvm/topolvm">TopoLVM</a></strong></li>
</ul>
</li>
<li><strong>The same storage concepts from traditional environments apply</strong>
<ul>
<li>Benchmark, benchmark, benchmark!</li>
</ul>

<h1 id="securing-the-postgres-physical-layer">Securing the Postgres physical layer</h1>
<h2 id="be-the-guardian-of-postgres-inside-kubernetes">Be the guardian of Postgres inside Kubernetes</h2>
<ul>
<li><strong>What I most often see with customers:</strong>
<ul>
<li>The infrastructure team has already provisioned the Kubernetes infrastructure</li>
<li>They have no special plan for Postgres <em>(unless you do)</em>
<ul>
<li>Runs on existing worker nodes, shared with other applications</li>
<li>Relies on network storage, shared with other applications</li>
</ul>
</li>
<li>Shared workloads and storage are OK to start a pilot program</li>
</ul>
</li>
<li>For long-term production, request a <strong>dedicated physical layer for Postgres</strong>
<ul>
<li>Nodes dedicated to Postgres through node <code>taints</code> and <code>labels</code> (next slides)</li>
<li>Where possible, <strong>bare metal nodes with local NVMe drives</strong> (best TCO)</li>
<li>This might lead to unexpected additional budget requests
<ul>
<li>Longer provisioning time, the earlier you start, the better</li>
<li>Especially on-premises (CAPEX)</li>
</ul>
</li>
</ul>

<h1 id="shared-postgres-architecture">Shared-Postgres architecture</h1>
<h2 id="the-herd-concept-many-postgres-instances-one-dedicated-pool">The <strong>herd</strong> concept: many Postgres instances, one dedicated pool</h2>
<ul>
<li>You dedicate nodes (node pool) for the Postgres workload (physical layer)
<ul>
<li>Kubernetes schedules Postgres pods across that pool the way a hypervisor schedules VMs across bare metal</li>
</ul>
</li>
<li>The building block is your AZ where they exist, otherwise the Kubernetes cluster
<ul>
<li>One dedicated Postgres node per AZ, <strong>3+ nodes minimum</strong> per Kubernetes cluster (4+ for safer node upgrades)</li>
</ul>
</li>
</ul>
<div class="img-center" style="--img-w: 860px; margin-top: 12px;">
<p><img src="images/physical-layer-shared-nothing.png" alt="" /></p>
</div>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="22" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="shared-nothing-architecture">Shared-nothing architecture</h1>
<h2 id="a-node-dedicated-to-a-single-cluster-instance">A node dedicated to a single Cluster instance</h2>
<ul>
<li><strong>True shared-nothing</strong>: a node is dedicated to a single instance of a single <code>Cluster</code></li>
<li>Reserved for your <strong>most important workloads</strong>, not the default - an opt-in tier</li>
<li>Kubernetes gives you <strong>full flexibility</strong> to mix both models on a per <code>Cluster</code> basis</li>
</ul>
<div class="img-center" style="--img-w: 440px; margin-top: 12px;">
<p><img src="images/k8s-world-shared-nothing-simple.png" alt="" /></p>
</div>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="23" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="defining-the-physical-layer">Defining the physical layer</h1>
<h2 id="dedicate-nodes-for-postgres-via-taints-and-labels">Dedicate nodes for Postgres via <code>taints</code> and <code>labels</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">kubectl taint node <span class="hljs-variable">${node}</span> \
  node-role.kubernetes.io/postgres=:NoSchedule

kubectl label node <span class="hljs-variable">${node}</span> \
  node-role.kubernetes.io/postgres=<span class="hljs-string">&quot;&quot;</span> \
  node-role.kubernetes.io/worker-
</code></pre>
<ul>
<li>These operations will be done by the infrastructure team, not you!</li>
<li><code>label</code> identifies the node; <code>taint</code> keeps everything else off it
<ul>
<li>CloudNativePG's <code>Cluster</code> resource will match it with its own <code>nodeSelector</code> and <code>tolerations</code></li>
</ul>
</li>
<li>No &quot;noisy neighbour&quot; competing for CPU, memory, and, possibly, the storage</li>
</ul>

<h1 id="recap">Recap</h1>
<h2 id="day-0">Day 0</h2>
<ul>
<li><strong>One building block</strong> per AZ, then Kubernetes cluster, replicated via <strong>Distributed Topology</strong></li>
<li><strong>Physical layer</strong>: AZs and nodes</li>
<li><strong>Logical layer</strong>: <code>Cluster</code> resource and Kubernetes Services</li>
<li><strong>Continuous backup</strong>:
<ul>
<li>Native snapshots</li>
<li>CNPG-I plugins (object storage, PVCs)</li>
</ul>
</li>
<li><strong>Storage</strong>: redundancy from <strong>Postgres replication</strong>, not storage</li>
<li><strong>Dedicated physical layer</strong>: Shared-Postgres (herd) or Shared-nothing</li>
</ul>

<h1 id="3-day-1">3. Day 1</h1>
<h2 id="deployments-through-the-cluster-resource-ha-backup-observability-gitops-rbac">Deployments through the <code>Cluster</code> resource: HA, backup, observability, GitOps, RBAC</h2>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-class="section-break" data-theme="edb" lang="it-IT" class="section-break" data-marpit-pagination="25" style="" data-marpit-pagination-total="41" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="26" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="the-cluster-resource">The <code>Cluster</code> resource</h1>
<h2 id="your-building-block-as-a-yaml-file">Your building block as a YAML file</h2>
<ul>
<li>The <strong><code>Cluster</code></strong> resource is the <strong>interface between DBAs and infrastructure team</strong></li>
<li><strong>Smallest unit of configuration</strong> for a Postgres cluster in CloudNativePG
<ul>
<li>You declare an HA topology, not a single instance</li>
<li>Backups too work at the Cluster level, not the instance</li>
</ul>
</li>
<li>Convention over configuration, with some strict defaults:
<ul>
<li>No superuser access over the network (<code>NULL</code> password for Postgres)</li>
<li><code>ALTER SYSTEM</code> is disabled</li>
<li>TLS by default (mTLS for HA replicas)</li>
<li>Read-only container filesystem (PGDATA lives on its own writable volume)</li>
<li>Fixed 5432 port (no pragmatic need to change it in Kubernetes)</li>
</ul>
</li>
</ul>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-kzjATuJu="" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="27" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="high-availability-the-declarative-way">High availability, the declarative way</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">postgresql.cnpg.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Cluster</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">acdc</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">instances:</span> <span class="hljs-number">3</span>
  <span class="hljs-attr">affinity:</span>
    <span class="hljs-attr">nodeSelector:</span>
      <span class="hljs-attr">node-role.kubernetes.io/postgres:</span> <span class="hljs-string">&quot;&quot;</span>
  <span class="hljs-attr">postgresql:</span>
    <span class="hljs-attr">synchronous:</span>
      <span class="hljs-attr">method:</span> <span class="hljs-string">any</span>
      <span class="hljs-attr">number:</span> <span class="hljs-number">1</span>
  <span class="hljs-attr">storage:</span>
    <span class="hljs-attr">size:</span> <span class="hljs-string">200Gi</span>
</code></pre>
<div class="caption">
<p><code>spec.postgresql.synchronous</code> controls quorum-based (<code>any</code>) synchronous replication directly</p>
</div>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="28" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="gitops-and-where-the-dbas-job-begins">GitOps, and where the DBA's job begins</h1>
<ul>
<li><strong>What I most often see with customers:</strong>
<ul>
<li>Organisations implement <strong>Infrastructure as Code</strong> and <strong>GitOps</strong> practices</li>
<li>Platform owns getting the YAML applied:
<ul>
<li><strong><a href="https://argoproj.github.io/cd/">Argo CD</a></strong> (git-based)</li>
<li><strong><a href="https://fluxcd.io/">Flux</a></strong> (also works &quot;gitless&quot;, straight from released OCI artifacts)</li>
</ul>
</li>
</ul>
</li>
<li>Your boundary is the <strong><code>Cluster</code> resource and everything inside its <code>spec</code></strong>:
<ul>
<li>That's Postgres domain, reviewed in the pull request</li>
<li>Everything above it (i.e. node pools, storage classes, network policies, ...) is platform domain</li>
</ul>
</li>
<li>Your new interface to production might be a <strong>pull request</strong>
<ul>
<li>Not a terminal on a database host</li>
</ul>
</li>
<li>Manual <code>kubectl apply</code> might still work
<ul>
<li>Common for <strong>local testing</strong>, and often good enough for <strong>dev/staging</strong></li>
<li>Available during Day 2 troubleshooting</li>
<li>GitOps is a discipline, not everyone adopts it - most valuable once you hit production</li>
</ul>
</li>
</ul>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="29" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="role-based-access-control-rbac">Role-Based Access Control (RBAC)</h1>
<h2 id="what-i-most-often-see-with-customers-in-terms-of-dba-permissions">What I most often see with customers in terms of DBA permissions</h2>
<ul>
<li><strong>RBAC</strong>: Kubernetes' native model for who can do what</li>
<li>The DBA is not granted a <code>cluster-admin</code> role</li>
<li>A dedicated, read-only <strong>DBA persona</strong> instead:
<ul>
<li><strong>Physical layer</strong>: read-only on nodes, PVs, PVCs</li>
<li><strong>Logical layer</strong>: <code>get</code>/<code>list</code>/<code>watch</code> on common CNPG and K8s-related resources
<ul>
<li><code>Cluster</code>, <code>Backup</code>, <code>Pooler</code>, <code>Lease</code>, <code>ConfigMap</code>s, <code>Service</code>s</li>
<li>Scoped <code>get</code> on <strong>application</strong> Secrets only</li>
<li><code>pods/portforward</code> to open a tunnel</li>
<li>no <code>pods/exec</code>/<code>attach</code> (no shell inside the container)</li>
</ul>
</li>
</ul>
</li>
<li><strong>Write access still happens: just through the pull request</strong></li>
<li>Day 2: troubleshooting may warrant a separate, temporary, audited elevated role (not the default)</li>
</ul>

<h1 id="backup-and-observability-declared">Backup and observability, declared</h1>
<h2 id="implement-what-you-already-decided-in-day-0">Implement what you already decided in Day 0</h2>
<ul>
<li><strong>Backup</strong>: just more fields in the <code>Cluster</code> spec
<ul>
<li>Standard interface with <code>Backup</code> and <code>ScheduledBackup</code> resources common to native and CNPG-I plugins</li>
</ul>
</li>
<li><strong>Logs</strong>: structured JSON to stdout, to your existing log stack
<ul>
<li>No log is stored inside the containers' volumes!</li>
</ul>
</li>
<li><strong>Metrics</strong>: built-in Prometheus exporter, nothing separate to install</li>
<li>Same principle as GitOps and RBAC:
<ul>
<li>Postgres integrates with the rest of the infrastructure</li>
</ul>
</li>
</ul>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-TZTVPkAD="" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="31" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="configuring-postgresql">Configuring PostgreSQL</h1>
<h2 id="how-configuration-changes-from-traditional-environments">How configuration changes from traditional environments</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">spec:</span>
  <span class="hljs-attr">postgresql:</span>
    <span class="hljs-attr">parameters:</span>
      <span class="hljs-attr">shared_buffers:</span> <span class="hljs-string">&quot;4GB&quot;</span>
      <span class="hljs-attr">max_connections:</span> <span class="hljs-string">&quot;200&quot;</span>
      <span class="hljs-attr">work_mem:</span> <span class="hljs-string">&quot;32MB&quot;</span>
</code></pre>
<p><strong>Before</strong>:</p>
<ul>
<li>DBAs edited <code>postgresql.conf</code>, <code>pg_hba.conf</code>, ... and Linux OS settings directly
<ul>
<li>Usually owning the machine itself</li>
</ul>
</li>
</ul>
<p><strong>Now</strong>:</p>
<ul>
<li>You change the <code>Cluster</code> resource, full stop
<ul>
<li>CloudNativePG writes the actual config files and applies them for you, safely</li>
</ul>
</li>
</ul>
<footer>G. Bartolini · Postgres Summit US</footer>

<h2 id="watch-what-you-built-in-day-1-then-grow-it">Watch what you built in Day 1, then grow it</h2>

<li><strong>Monitor backups</strong>: one more metric on the Day 1 dashboard</li>
<li><strong>Restore drills</strong>: an untested backup is a <strong>hypothesis</strong>, not a backup</li>

<li><strong>Grow your metrics</strong>: the exporter's defaults are a floor, not the ceiling</li>
</ul>

<p>What if <strong>moving clouds</strong> for Postgres was just a <code>Cluster</code> pointed somewhere else?</p>
<footer>G. Bartolini · Postgres Summit US</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="G. Bartolini · Postgres Summit US" data-theme="edb" lang="it-IT" data-marpit-pagination="38" style="--paginate:true;--footer:G. Bartolini · Postgres Summit US;--theme:edb;" data-marpit-pagination-total="41">
<h1 id="portability-and-sovereignty">Portability and sovereignty</h1>
<ul>
<li>The five eras end at &quot;runs anywhere&quot; (<strong>Cloud Neutral Postgres</strong>)</li>
<li>The CloudNativePG building blocks in this presentation make that literal (Distributed Topology)
<ul>
<li>Postgres physical replication plus <strong>independent object stores per site</strong></li>
<li>Works identically on-prem ↔ public cloud, or public cloud ↔ public cloud</li>
<li>Sovereignty becomes your choice (owning the infrastructure)</li>
</ul>
</li>
</ul>
<div class="img-center" style="--img-w: 640px; margin-top: 16px;">
<p><img src="images/migration-rds-portability.png" alt="" /></p>
</div>
<footer>G. Bartolini · Postgres Summit US</footer>

<h1 id="key-takeaways">Key takeaways</h1>
<ul>
<li><strong>Day 0</strong>: one building block, physical and logical, not a <code>pg_dump</code>-and-hope migration</li>
<li><strong>Day 1</strong>: HA, backup, and access all become <strong>declarative</strong>
<ul>
<li>GitOps and RBAC make your interface to production a pull request</li>
</ul>
</li>
<li><strong>Day 2</strong>: an unrestored backup or unwatched dashboard is a <strong>hypothesis</strong>
<ul>
<li>Every upgrade, Postgres or Kubernetes, rolls out the same safe way</li>
</ul>
</li>
<li><strong>Sovereignty and portability</strong> come free with an architecture built this way from day one</li>
</ul>
<footer>G. Bartolini · Postgres Summit US</footer>
